name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows x64 / Qt 6.6.3 / Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt 6.6.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Configure MSVC and build Release
        shell: pwsh
        run: >-
          & ./scripts/build.ps1
          -QtRoot "$env:QT_ROOT_DIR"
          -BuildDirectory (Join-Path $env:GITHUB_WORKSPACE 'build-ci')
          -Configuration Release

      - name: Run smoke tests
        shell: pwsh
        run: ctest --test-dir build-ci -C Release --output-on-failure
